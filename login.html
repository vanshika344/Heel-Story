<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Heel &amp; Story</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Cinzel:wght@400;500;600;700&family=Jost:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="checkout.css">
</head>

<body class="co-page-body">
    <nav class="navbar scrolled" id="navbar">
        <div class="nav-inner">
            <a href="index.html" class="nav-logo">H&amp;S.</a>
            <div class="nav-links">
                <a href="index.html#home">Home</a>
                <a href="index.html#occasions">Occasions</a>
                <a href="shop.html">Shop</a>
                <a href="about.html">About</a>
                <a href="login.html" class="active-nav">Login</a>
            </div>
        </div>
    </nav>

    <main class="co-main">
        <div class="co-card" style="max-width: 460px;">
            <h1 class="co-title">Welcome Back</h1>
            <form id="loginForm" class="co-form">
                <label>Email <input type="email" name="email" required autocomplete="email"></label>
                <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
                <button class="co-btn" type="submit">Login</button>
            </form>
            <p class="co-note" style="margin-top: 1.4rem;">New here? <a href="shop.html" class="co-link">Continue as guest</a></p>
        </div>
    </main>

    <script>
        // Design demo only: no checking, just continues to the shop.
        document.getElementById('loginForm').addEventListener('submit', e => {
            e.preventDefault();
            window.location.href = 'shop.html';
        });
    </script>
</body>

</html>
